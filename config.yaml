schema_version: 1

database:
  url: "postgresql://hans_enhanced:change_me@127.0.0.1:5434/hans_enhanced"

paths:
  web_json_dir: "scrape/htw_student_data"
  excel_path: "HANS - Training Email Data.xlsx"
  objects_dir: "data/objects"
  programme_catalog: "data/programme_catalog.json"
  programme_official_pages: "data/programme_official_pages.json"

ingestion:
  min_chars: 200
  chunk_chars: 900
  chunk_overlap: 150
  skip_short: false

model:
  embedding_model: "BAAI/bge-base-en-v1.5"
  embedding_dim: 768

retrieval:
  top_k_db: 30
  top_k: 8
  distance: "cosine"
  min_score: 0.0

  reranker:
    enabled: true
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    max_rerank: 30

runtime:
  ollama_base_url: "https://f2ki-h100-1.f2.htw-berlin.de:11435"
  ollama_model: "qwen3:32b"
  ollama_timeout: 300

  # Keep false only during development if HTW currently uses a
  # certificate that cannot yet be verified.
  # Production should use true with the correct HTW CA certificate.
  verify_ssl: true

email_assistant:
  enabled: true
  max_topics: 6
  retrieval_per_topic: 6
  final_source_limit: 8
  require_staff_review: true
  automatic_send: false
  default_language: "en"

quality:
  minimum_grounding_confidence: 0.65
  require_citations: true
  require_programme_match_for_programme_topics: true
  require_direct_sources_for_high_risk_topics: true

thread_memory:
  enabled: true
  storage: "json-development"
  retention_days: 30

logging:
  store_raw_email: false
  store_generated_draft: false
  store_source_ids: true
  store_review_reason: true

database_tuning:
  ivfflat_probes: 10
  connection_pool_size: 5
  connection_timeout: 30